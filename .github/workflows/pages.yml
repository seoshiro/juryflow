name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:oracle
      - run: npm run build
      # The hosted image already supplies Chrome's native libraries. Avoid an
      # unrelated APT font upgrade through a potentially stalled Ubuntu mirror.
      # Playwright still validates native libraries and runs the complete suite.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  live:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-release.mjs https://seoshiro.github.io/juryflow/ "$GITHUB_SHA"
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://seoshiro.github.io/juryflow/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
